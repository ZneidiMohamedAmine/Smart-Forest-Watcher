name: SSH Debug

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/key
          chmod 600 /tmp/key
          ssh-keygen -lf /tmp/key
      - name: SSH deploy test
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: |
            ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          debug: true
          script: |
            echo "===== SSH SUCCESS ====="
            whoami
            hostname
            pwd
