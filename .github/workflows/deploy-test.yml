name: Deploy SSH Test

on:
  workflow_dispatch:

jobs:
  deploy-test:
    runs-on: ubuntu-latest

    steps:
      - name: Validate SSH key
        run: |
          echo "${{ secrets.SERVER_SSH_KEY }}" > /tmp/key
          chmod 600 /tmp/key
          head -1 /tmp/key
          tail -1 /tmp/key
          ssh-keygen -lf /tmp/key
      - name: Test SSH connection
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          debug: true
          command_timeout: 1m

          script: |
            echo "===== SSH SUCCESS ====="
            echo "User:"
            whoami

            echo "Hostname:"
            hostname

            echo "Current directory:"
            pwd

            echo "Docker:"
            docker --version || echo "Docker not found"

            echo "Compose:"
            docker compose version || echo "Compose not found"

            echo "======================="
