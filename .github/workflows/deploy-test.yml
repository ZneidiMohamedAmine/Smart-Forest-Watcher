name: SSH Debug

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: SSH deploy test
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: |
            ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          debug: true
          script: |
            echo "===== SSH SUCCESS ====="
            whoami
            hostname
            pwd
