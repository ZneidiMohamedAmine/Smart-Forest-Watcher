name: Tests

on:
  push:
    branches:
      - main

  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-alpine

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install system packages
        run: |
          apk add --no-cache \
            build-base \
            gdal-dev \
            geos-dev \
            postgresql-dev \
            proj-dev

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            Django==4.2.11 \
            pytest==8.4.2 \
            pytest-django==4.11.1 \
            celery==5.5.3 \
            daphne==4.1.2 \
            channels==4.3.1 \
            channels-redis==4.3.0 \
            django-location-field==2.7.3 \
            django-prometheus==2.3.1 \
            firebase-admin==6.9.0 \
            django-redis==5.4.0 \
            joblib==1.5.1 \
            paho-mqtt==2.1.0 \
            psycopg2-binary==2.9.9 \
            redis==6.2.0 \
            whitenoise==6.6.0 \
            pillow==10.3.0

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: project.settings.development
          GDAL_LIBRARY_PATH: /usr/lib/libgdal.so
        run: pytest tests/test_health.py

  security:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Prepare Linux dependency audit file
        run: |
          grep -Ev "^(GDAL @|twisted-iocpsupport==|psycopg2==)" requirements.txt > requirements-audit.txt

      - name: Run pip-audit dependency scan
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements-audit.txt

      - name: Run Bandit Python SAST
        uses: PyCQA/bandit-action@8a1b30610f61f3f792fe7556e888c9d7dffa52de # v1
        with:
          targets: .
          skips: B101
          exclude: .git,.github,venv,.venv,env,__pycache__,staticfiles,logs,img,client/static,home/static,supervisor/static

      - name: Run Gitleaks secret detection
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        with:
          args: detect --no-git --redact --source .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run SonarCloud analysis
        if: env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' && env.SONAR_PROJECT_KEY != ''
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        with:
          args: >
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.sources=.
            -Dsonar.exclusions=venv/**,.venv/**,env/**,staticfiles/**,logs/**,img/**,client/static/**,home/static/**,supervisor/static/**,**/__pycache__/**
            -Dsonar.python.version=3.11

  publish-image:
    needs:
      - pytest
      - security
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          no-cache: true 
          load: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
          

      - name: Push image
        run: |
          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"



  deploy:
    needs:
      - publish-image
    runs-on: ubuntu-latest
  
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare deploy directory
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          timeout: 30s
          script: |
            sudo mkdir -p /opt/smart-forest-watcher
            sudo chown -R ubuntu:ubuntu /opt/smart-forest-watcher

      - name: Copy compose files and monitoring config to server
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "docker-compose.yml,docker-compose.mlops.yml,monitoring"
          target: /opt/smart-forest-watcher
          strip_components: 0

      - name: Deploy to server
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          script: |
            set -euo pipefail

            echo "===== SSH SUCCESS ====="
            whoami
            hostname
            pwd

            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker not found, installing..."
              curl -fsSL https://get.docker.com | sudo sh
              sudo usermod -aG docker "$USER"
            fi

            if ! docker compose version >/dev/null 2>&1; then
              echo "Docker Compose plugin not found, installing..."
              sudo apt-get update -y
              sudo apt-get install -y docker-compose-plugin
            fi

            echo "Docker:"
            docker --version

            echo "Compose:"
            docker compose version

            cd /opt/smart-forest-watcher

            echo "Pulling latest image..."
            docker compose --env-file config.env pull

            echo "Restarting containers..."
            docker compose --env-file config.env up -d

            echo "Container status:"
            docker compose --env-file config.env ps

            echo "Deployment finished"
