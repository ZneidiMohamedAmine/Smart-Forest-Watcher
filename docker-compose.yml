name: forest-fire-prediction

x-app: &app
  image: ghcr.io/zneidimohamedamine/smart-forest-watcher:latest
  pull_policy: always
  env_file:
    - config.env
  environment:
    DJANGO_ENV: docker
    DJANGO_SETTINGS_MODULE: project.settings.production
    IN_DOCKER: "1"

    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"

    REDIS_HOST: redis
    REDIS_PORT: "6379"

    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/0

  volumes:
    - staticfiles:/app/staticfiles
    - logs:/app/logs
    - detection_images:/app/img
    - dataset_finale:/app/yolo/data

  networks:
    - fire-network

  restart: unless-stopped


services:

  web:
    <<: *app
    container_name: fire_web

    command: >
      sh -c "
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      python manage.py load_locations &&
      daphne -b 0.0.0.0 -p 8000 project.asgi:application
      "

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8000"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s


  celery:
    <<: *app
    container_name: fire_celery

    command:
      celery -A project worker --loglevel=info

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy


  celery-beat:
    <<: *app
    container_name: fire_celery_beat

    command:
      celery -A project beat --loglevel=info --schedule=/app/logs/celerybeat-schedule

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy


  db:
    image: postgis/postgis:15-3.4
    container_name: fire_db

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?missing POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?missing POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - fire-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  redis:
    image: redis:7-alpine
    container_name: fire_redis

    command:
      redis-server --appendonly yes

    volumes:
      - redis_data:/data

    networks:
      - fire-network

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped



  prometheus:
    image: prom/prometheus:latest
    container_name: fire_prometheus

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    ports:
      - "9090:9090"

    networks:
      - fire-network

    restart: unless-stopped


  grafana:
    image: grafana/grafana:latest
    container_name: fire_grafana

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}

    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

    ports:
      - "3000:3000"

    depends_on:
      - prometheus

    networks:
      - fire-network

    restart: unless-stopped


  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: fire_postgres_exporter

    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - fire-network

    restart: unless-stopped


  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: fire_redis_exporter

    environment:
      REDIS_ADDR: "redis://redis:6379"

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - fire-network

    restart: unless-stopped


networks:
  fire-network:
    driver: bridge


volumes:
  postgres_data:
  redis_data:
  staticfiles:
  logs:
  prometheus_data:
  grafana_data:
  detection_images:
  dataset_finale:
