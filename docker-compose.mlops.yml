name: safety-watcher-mlops

# Standalone MLOps observability stack, separate from the main app's
# docker-compose.yml on purpose — this is optional infrastructure for
# training/experiment tracking, not something the running app depends on.
#
# Usage:
#   docker compose -f docker-compose.mlops.yml up -d
#   open http://localhost:5000 for the MLflow UI
#
# To have the yolo/scripts/*.py pipeline log here instead of the local
# file-based mlruns/ store, run it with:
#   MLFLOW_TRACKING_URI=http://localhost:5000 python yolo/scripts/train.py ...

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    container_name: safety_watcher_mlflow

    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000

    ports:
      - "5000:5000"

    volumes:
      - mlflow_data:/mlflow

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mlflow_data:
